</style><style id="custom-font"></style></head><body><div id="editor"></div><div id="site"></div><dialog id="dialog" class="dialog"></dialog><input id="import-file" type="file" accept="application/json,.html" hidden><script type="application/json" id="site-data">{"version":2,"title":"Di Wu | Personal Academic Website","accent":"#265575","text":"#333333","font":"Avenir Light","fontData":"","fontSize":18,"width":1320,"logo":"assets/image-01-fd8b49c5.webp","logoAlt":"Di Wu — Home","portrait":"assets/image-02-ae057b56.webp","portraitAlt":"Portrait of Di Wu","nav":[{"label":"HOME","url":"#home"},{"label":"CV","url":"https://drive.google.com/file/d/1ehdkvPxNCLFqYdfIdWJBfn8jnKpzdyMW/view?usp=sharing"},{"label":"ARCHITECTURE","url":"#architecture"},{"label":"CONTACT","url":"#contact"}],"social":[{"label":"CV","icon":"cv","url":"https://drive.google.com/file/d/1ehdkvPxNCLFqYdfIdWJBfn8jnKpzdyMW/view?usp=sharing","image":"assets/image-03-3290f792.png"},{"label":"Google Scholar","icon":"scholar","url":"https://scholar.google.com/citations?user=K9bhr9IAAAAJ&hl=en","image":"assets/image-04-69c76eae.webp"},{"label":"Twitter","icon":"twitter","url":"https://x.com/DeeOhh2023","image":"assets/image-05-1b8baea8.png"},{"label":"LinkedIn","icon":"linkedin","url":"https://www.linkedin.com/in/di-wu-859270235/","image":"assets/image-06-ed8c43a3.png"},{"label":"Email","icon":"email","url":"mailto:diwu2028@u.northwestern.edu","image":"assets/image-07-270a2ab7.png"}],"bio":["I’m \u003cstrong>Di Wu（吴 迪）\u003c/strong>, a second-year \u003cstrong>PhD Candidate in Computer Science\u003c/strong> at \u003cstrong>Northwestern University\u003c/strong>, working in the \u003ca href=\"https://tiilt.northwestern.edu/\">\u003cstrong>tiilt Lab\u003c/strong>\u003c/a> advised by \u003ca href=\"https://sites.northwestern.edu/marceloworsley/\">\u003cstrong>Professor Marcelo Worsley\u003c/strong>\u003c/a>.","I explore \u003cstrong>how interactive systems can become physical, embedded, and intuitive—not just moving interfaces onto the human body, but turning the human body into the interface itself\u003c/strong>, in the spirit of Ivan Sutherland’s Ultimate Display, where the boundaries between perception and control dissolve, and actuation and sensing fuse into experience. To realize this vision, I advocate for a \u003cstrong>systematic design space\u003c/strong> that spans \u003cstrong>material innovation, device fabrication, power management, and human-computer interaction\u003c/strong>—toward soft, embodied devices that seamlessly weave into the fabrics of everyday life. Within this fabric, new possibilities emerge—in assistive technology, rehabilitation, and embodied learning.","Before starting my Ph. D. at \u003cstrong>Northwestern\u003c/strong>, I had the pleasure of working in \u003ca href=\"https://morphingmatter.org/\">\u003cstrong>Morphing Matter Lab\u003c/strong>\u003c/a>, advised by \u003cstrong>\u003ca href=\"https://morphingmatter.org/member/lining-yao\">Professor Lining Yao\u003c/a>\u003c/strong> and \u003cstrong>\u003ca href=\"https://www.interbeinglab.com/member/qiuyulu\">Doctor Qiuyu Lu\u003c/a>\u003c/strong> (now Assistant Professor at Hong Kong Polytechnic University). I received my Master’s from \u003cstrong>Carnegie Mellon University\u003c/strong>, and my Bachelor of Architecture from \u003cstrong>Huazhong University of Science and Technology (HUST)\u003c/strong>."],"newsTitle":"\u003cb>NEWS\u003c/b>","news":[{"date":"11/05/2026","html":"UIST 2026 is a wrap, and I’m back in Chicago! Detroit’s coffee and food were a highlight. It was great catching up with old friends and meeting new ones.","_uid":"688894bc-77a5-4678-b788-d72e19f4518f"},{"date":"11/03/2026","html":"Stop by my poster at tonight’s Poster &amp; Demo Session (6–9 p.m.)! I’ll share how we turn ionized wind into tactile feedback for VR. Come chat about how air can become something you feel.\u003cbr>","_uid":"744a37cc-6b2f-411c-9161-48898f9c2a23"},{"date":"11/02/2026","html":"I’m in Detroit for UIST 2026! If you’re here too, come say hi. I’d love to catch up!","_uid":"15b822ec-c70d-4116-9bfc-bdb77a9967fb"},{"date":"08/15/2026","html":"My UIST poster paper has just been accepted! This work explores a new research direction that I’ve been developing since joining my new lab—a new paradigm for VR haptics. Not an easy journey, but it’s incredibly exciting to bring this idea to life. See you all in Detroit!","_uid":"041421a8-0d7d-40e2-bdae-f8613f36f362"},{"date":"03/31/2026","html":"Started my third TA in COMP_SCI 333: Interactive Information Visualization!","_uid":"8dddffd4-7f45-4741-afb7-45eb04cf1b5f"},{"date":"03/12/2026","html":"Successfully passed my PhD qualifying exam. Deep thanks to my amazing committee: Prof. Marcelo Worsley, Prof. Michael Horn, and Prof. Karan Ahuja!","_uid":"100cd59d-94eb-49b2-a8c9-00348cbbd4cf"},{"date":"03/11/2026","html":"ACM TEI 2026 wrapped up smoothly—grateful for the experience and the incredible people I met along the way.","_uid":"e4506658-f3b3-4d99-a9fe-d9253120f397"},{"date":"03/08/2026","html":"ACM TEI 2026 (20th edition) is finally here at the University of Chicago—excited to be part of it!","_uid":"543ef3d8-2c2d-436f-985c-0fd89c89b33e"},{"date":"01/22/2026","html":"Just finished two papers (CHI Demo and DIS) today!","_uid":"ac6a4e4f-6e57-47d4-b7ba-158ea035f300"},{"date":"01/10/2026","html":"Still working on our submission to ACM DIS 2026!","_uid":"4e9c366b-d6d7-4d09-a8a8-7f707fe1c730"},{"date":"01/09/2026","html":"Excited to wrap up our new demo paper for ACM CHI 2026!","_uid":"a1a62a75-49d5-46cf-a79a-83ba69a98062"},{"date":"01/05/2026","html":"Back to Evanston and started my second TA in COMP_SCI 110 Introduction in Computer Programming!","_uid":"de2f8db5-29e7-4391-9051-f040be669085"},{"date":"01/02/2026","html":"Got the printed business cards in both English and Traditional Chinese versions! Can't wait to share with you!","_uid":"96995b07-f35c-4364-ab4f-982da5d6b4ce"},{"date":"12/19/2025","html":"Happy to announce that I have completed the first milestone of my PhD: completing my MSCS in Primary PhD!","_uid":"b9e8a902-1813-4e92-a826-ca7f913ae8bf"},{"date":"12/15/2025","html":"Finished my first TA in COMP_SCI 330 Human-computer Interaction during my PhD! Shout out to Prof. Matthew Kay!","_uid":"91ee7797-b11f-4ea5-9a1a-ed1d25524c07"},{"date":"12/08/2025","html":"Preparing my trip back to China for the family reunion!","_uid":"9e6cff29-b8f6-483f-8497-028c3024adf5"},{"date":"10/22/2025","html":"Finished reviewing the paper from ACM CHI 2026!","_uid":"d6c06b01-c883-4ae3-85d9-583f834fc7e8"},{"date":"09/18/2025","html":"Finished reviewing 2 papers from ACM TEI 2026!","_uid":"17d70d55-cb12-4861-b7c8-1a52139559df"},{"date":"03/06/2025","html":"Excited to serve ACM TEI 2026 as one of the Hybrid Chairs! See you all in Chicago!","_uid":"71b4a799-df07-4e75-ab30-11aa154cdd04"}],"researchTitle":"\u003cb>RESEARCH PROJECTS\u003c/b>","researchIntro":"My long-term vision is to build interfaces by fusing materials, mechanics, and interaction. Publications in ACM CHI and ACM UIST have advanced morphing interfaces and material-driven interactivity, while work published in materials journals such as Materials Horizons explores reconfigurable soft electronics. In parallel, submissions to engineering venues like IEEE Sensors focus on durable, low-voltage actuation. Together, these works lay the foundation for systems where the human body becomes the interface itself.","papers":[{"venue":"\u003cb>ACM UIST 2026 [Poster Paper]\u003c/b>","title":"\u003cb>Air as a Soft Material: Introducing the Ionized-Wind Actuator (IoWA) for VR Haptics in Human–Computer Interaction\u003c/b>","authors":"\u003cb>Di Wu\u003c/b>, Zhongyun Cao, Marcelo Worsley","status":"PDF\u003cbr>","image":"assets/image-08-2fe285b0.jpg","alt":"Air as a Soft Material: Introducing the Ionized-Wind Actuator (IoWA) for VR Haptics in Human–Computer Interaction — project figure","pdf":"","doi":"","link":"","_uid":"fb8488a8-bb21-4ffc-ba3d-7001db2ecc0e"},{"venue":"\u003cb>North America Materials Education Symposium 2025 [Symposium]\u003c/b>","title":"\u003cb>Teaching Soft Robotics Through Co-Design of Materials, Mechanics, and Electronics: A Focus on Electrohydraulic Artificial Muscles\u003c/b>","authors":"\u003cb>Di Wu\u003c/b>, Ruihang Gao, Pavel Belakurski, Purnendu, Nivedita Arora","status":"","image":"assets/image-09-8a5761f5.webp","alt":"Teaching Soft Robotics Through Co-Design of Materials, Mechanics, and Electronics: A Focus on Electrohydraulic Artificial Muscles — project figure","pdf":"","doi":"","link":"","_uid":"19e6fcd4-9062-4fc8-945b-8f9027379dc2"},{"venue":"\u003cb>IEEE Sensor 2025 [Full Article]\u003c/b>","title":"\u003cb>Easy-to-Fabricate and Durable Soft Electrohydraulic Actuator for Hands-On Robotics Education\u003c/b>","authors":"\u003cb>Di Wu\u003c/b>, Pavel Belakurski*, Ruihang Gao*, Gyda Nawrungruang, Xuyang Li, Jonah Robinson, Brandon Tendilla, Purnendu, Nivedita Arora","status":"Under review","image":"assets/image-10-911972bf.webp","alt":"Easy-to-Fabricate and Durable Soft Electrohydraulic Actuator for Hands-On Robotics Education — project figure","pdf":"","doi":"","link":"","_uid":"2bb104c1-60e8-4ff6-af47-92e6c74f4a35"},{"venue":"\u003cb>Materials Horizons 2025 [Full Article]\u003c/b>","title":"\u003cb>Wearable and Reconfigurable Smart Textile Circuit with Liquid Metal\u003c/b>","authors":"Chanho Jeong, Kiyoon Kwon, \u003cb>Di Wu\u003c/b>, Yibo Fu, Yeong-sim Ye, Lining Yao, Tae-il Kim, Carmel Majidi.","status":"","image":"assets/image-11-8f03c7a8.webp","alt":"Wearable and Reconfigurable Smart Textile Circuit with Liquid Metal — project figure","pdf":"","doi":"https://doi.org/10.1039/D5MH00462D","link":"","_uid":"8dcea91c-b2b6-4b64-b93d-10fc9815047c","linkLabels":{}},{"venue":"\u003cb>ACM CHI 2024 [Full Article]\u003c/b>","title":"\u003cb>Waxpaper Actuator: Sequentially and Conditionally Programmable Wax Paper for Morphing Interfaces\u003c/b>","authors":"\u003cb>Di Wu\u003c/b>, Emily Guan*, Yunjia Zhang*, Hsuanju Lai, Qiuyu Lu, Lining Yao","status":"","image":"assets/image-12-bd29c7ac.webp","alt":"Waxpaper Actuator: Sequentially and Conditionally Programmable Wax Paper for Morphing Interfaces — project figure","pdf":"","doi":"https://doi.org/10.1145/3613904.3642373","link":"","_uid":"49ea089f-16cc-4c8a-9d66-16331d0e9aac","linkLabels":{}},{"venue":"\u003cb>ACM CHI 2023 [Full Article]\u003c/b>","title":"\u003cb>EpoMemory: Multi-state Shape Memory for Programmable Morphing Interfaces\u003c/b>","authors":"Ke Zhong, Adriane Fernandes Minori, \u003cb>Di Wu\u003c/b>, Humphrey Yang, Mohammad Islam, Lining Yao","status":"","image":"assets/image-13-cdaf9c72.webp","alt":"EpoMemory: Multi-state Shape Memory for Programmable Morphing Interfaces — project figure","pdf":"","doi":"https://doi.org/10.1145/3544548.3580638","link":"","_uid":"ba726c72-dace-484a-afa9-ba20770efb25","linkLabels":{}},{"venue":"\u003cb>ACM CHI EA 2023 [Demo]\u003c/b>","title":"\u003cb>Demonstrating Waxpaper Plus: Sequentially and Conditionally Programmable Morphing Wax Fabrics\u003c/b>","authors":"\u003cb>Di Wu*\u003c/b>, Qiuyu Lu*, Hsuanju Lai**, Yunjia Zhang**, Lining Yao","status":"","image":"assets/image-14-7cd44068.webp","alt":"Demonstrating Waxpaper Plus: Sequentially and Conditionally Programmable Morphing Wax Fabrics — project figure","pdf":"","doi":"https://doi.org/10.1145/3544549.3583924","link":"","_uid":"4b5a7c37-b028-447b-b5dc-680d6cc70862","linkLabels":{}},{"venue":"\u003cb>ACM CHI EA 2024 [Demo]\u003c/b>","title":"\u003cb>Design and Simulation Tool for Sequentially and Conditionally Programmable Waxpaper Morphing Interfaces\u003c/b>","authors":"Emily Guan, \u003cb>Di Wu\u003c/b>, Qiuyu Lu, Lining Yao","status":"","image":"assets/image-15-55df9f44.webp","alt":"Design and Simulation Tool for Sequentially and Conditionally Programmable Waxpaper Morphing Interfaces — project figure","pdf":"","doi":"https://doi.org/10.1145/3613905.3648661","link":"","_uid":"642b81d1-4c1d-490 function inlineLinkURL(value){
  const address=value.trim();
  if(/^#[^\s]+$/.test(address))return address;
  if(/^mailto:[^\s@]+@[^\s@]+$/i.test(address))return address;
  const candidate=/^https?:\/\//i.test(address)?address:
    /^[\w-]+(?:\.[\w-]+)+(?:[/?#:]|$)/.test(address)?'https://'+address:'';
  if(!candidate||/\s/.test(candidate))return '';
  try{return new URL(candidate).hostname?candidate:'';}catch{return '';}
}

  const address=inlineLinkURL($('#inline-url').value);
  if(!address)alert('请输入有效的网址、邮箱链接或页面锚点');
  return address;
}
function addTextLink(range){
  const start=range.startContainer;
  const end=range.endContainer;
  const host=(start.nodeType===1?start:start.parentElement)?.closest('[data-edit]');
  if(!host?.isConnected||host.dataset.edit!==textEditingPath||!host.contains(end)||range.collapsed||!range.toString().trim()){
    alert('请先双击文字进入编辑，再选中要添加链接的文字');
    return;
  }
  // Capture the selected text before the modal moves focus away from the editor.
  const walker=document.createTreeWalker(host,NodeFilter.SHOW_TEXT);
  const runs=[];
  for(let node=walker.nextNode();node;node=walker.nextNode()){
    if(!range.intersectsNode(node))continue;
    const from=node===start?range.startOffset:0;
    const to=node===end?range.endOffset:node.length;
    if(to>from)runs.push({node,from,to});
  }
  show('添加文字链接',input('inline-url','地址','https://'),()=>{
    const address=linkAddress();
    if(!address||!host.isConnected)return false;
    if(!runs.some(({node})=>node.parentElement.closest('a'))){
      const anchor=document.createElement('a');
      anchor.setAttribute('href',address);
      anchor.append(range.extractContents());
      range.insertNode(anchor);
    }else for(const {node,from,to} of runs){
      const existing=node.parentElement.closest('a');
      if(existing&&host.contains(existing)){existing.setAttribute('href',address);continue;}
      const part=document.createRange();
      part.setStart(node,from);
      part.setEnd(node,to);
      const anchor=document.createElement('a');
      anchor.setAttribute('href',address);
      part.surroundContents(anchor);
    }
    set(host.dataset.edit,clean(host.innerHTML));
  });
}

    if(!address||!host.isConnected)return false;
    anchor.setAttribute('href',address);
    set(host.dataset.edit,clean(host.innerHTML));
  });
}

function arrangeSelected(mode){const els=selectedElements();if(els.length<2)return;const items=els.map(el=>({el,path:el.dataset.element,rect:el.getBoundingClientRect(),parent:el.parentElement.getBoundingClientRect(),s:{...styleFor(el.dataset.element)}}));let reference=null;if(arrangeReference==='content'){const r=document.querySelector('main.shell').getBoundingClientRect();reference={left:r.left,top:r.top,width:r.width,height:r.height};}if(arrangeReference==='key'){const r=selectedElement()?.getBoundingClientRect();if(r)reference={left:r.left,top:r.top,width:r.width,height:r.height};}const plan=arrangementPlan(items.map(item=>item.rect),mode,reference,Number($('#arrange-gap').value));if(!plan.some(p=>Math.abs(p.dx)>.01||Math.abs(p.dy)>.01))return;snapshot();items.forEach((item,i)=>{const s={...item.s,x:(item.s.x||0)+plan[i].dx/item.parent.width*100,y:(item.s.y||0)+plan[i].dy/layoutScale()};model.layout[layoutKey(item.path)]=s;});for(const item of items)applyOne(item.el,item.path);changed();updateSelection();}

function readDraft(db,key){
  return new Promise((resolve,reject)=>{
    const request=db.transaction('draft').objectStore('draft').get(key);
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}
async function initializeEditor(){
  draftStatus=localFile?'本地编辑器 · 内置网站版本':'已载入 · 网站当前版本';
  if(!localFile&&editorDocument){
    try{
      const response=await fetch('index.html',{cache:'no-store'});
      if(!response.ok)throw Error('Unable to load index.html');
      const source=new DOMParser().parseFromString(await response.text(),'text/html');
      const live=JSON.parse(source.querySelector('#site-data')?.textContent||'null');
      if(live?.version!==2)throw Error('Unknown website format');
      model=live;
    }catch(error){
      draftStatus='网站版本加载失败 · 当前显示编辑器内置版本';
    }
  }
  const bytes=new TextEncoder().encode(JSON.stringify(model));
  let revision;
  if(crypto.subtle){
    revision=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),byte=>byte.toString(16).padStart(2,'0')).join('');
  }else{
    let hash=2166136261;
    for(const byte of bytes)hash=Math.imul(hash^byte,16777619);
    revision=bytes.length+'-'+(hash>>>0);
  }
  activeDraftKey=draftKey+':'+revision;
  try{
    const store=await db();
    try{
      const [current,latest,legacy]=await Promise.all([
        readDraft(store,activeDraftKey),readDraft(store,draftKey+':latest'),readDraft(store,draftKey)
      ]);
      if(current?.version===2){
        model=current;
        draftStatus='已恢复此版本的浏览器草稿 · 尚未发布';
      }
      const older=latest&&latest!==activeDraftKey?await readDraft(store,latest):legacy||(localFile?await readDraft(store,'model'):null);
      if(older?.version===2&&JSON.stringify(older)!==JSON.stringify(model))recoverableDraft=older;
    }finally{store.close();}
  }catch(error){
    draftStatus+=' · 浏览器草稿不可用';
  }
}
(async()=>{if(editing)await initializeEditor();render();})();

 if(!legacy.length)return;
 const old=main.cloneNode(true);old.classList.add('legacy-canvas');Object.assign(old.style,{position:'absolute',left:'-20000px',top:'0',width:main.getBoundingClientRect().width+'px',margin:'0',visibility:'hidden',pointerEvents:'none'});old.removeAttribute('data-narrow');if(main.hasAttribute('data-narrow'))old.setAttribute('data-narrow','');document.body.append(old);
 for(const el of legacy){const item=floatingItem(el),path=el.dataset.element,ghost=[...old.querySelectorAll('.inserted-image')].find(n=>n.dataset.element===path),r=ghost.getBoundingClientRect(),hosts=[...old.querySelectorAll('[data-canvas-anchor]')],host=hosts.filter(n=>{const b=n.getBoundingClientRect();return r.top+Math.min(r.height/2,30)>=b.top&&r.top+Math.min(r.height/2,30)<=b.bottom;}).at(-1)||old,b=host.getBoundingClientRect(),target=anchorNode(host.dataset.canvasAnchor),width=target.getBoundingClientRect().width;
 item.positionVersion=2;item.anchor=host.dataset.canvasAnchor||null;model.layout[layoutKey(path)]={...styleFor(path),x:(r.left-b.left)/width*100,y:(r.top-b.top)/layoutScale(),w:r.width/width*100};target.append(el);applyOne(el,path);

}

function floatingItem(el){const [group,index]=el.dataset.element.split('.');return ['images','textboxes'].includes(group)?model[group]?.[Number(index)]:null;}
function anchorNode(anchor){return [...document.querySelectorAll('[data-canvas-anchor]')].find(el=>el.dataset.canvasAnchor===anchor)||document.querySelector('main.shell');}
function mountFloating(){for(const el of document.querySelectorAll('.inserted-image,.inserted-text')){const item=floatingItem(el);anchorNode(item?.anchor)?.append(el);}}
function nearestAnchor(y){const all=[...document.querySelectorAll('[data-canvas-anchor]')];return all.filter(el=>{const r=el.getBoundingClientRect();return y>=r.top&&y<=r.bottom;}).at(-1)||document.querySelector('main.shell');}
function insertionPlacement(width){const selected=selectedElement(),preferred=selected?.closest('[data-canvas-anchor]'),top=Math.max(($('#layout-panel')?.getBoundingClientRect().bottom||72)+35,110),host=preferred||nearestAnchor(top),r=host.getBoundingClientRect(),y=Math.max(0,Math.min(Math.max(0,r.height-50),top-r.top));return {positionVersion:2,anchor:host.dataset.canvasAnchor||null,geometry:{x:40,y:y/layoutScale(),w:width}};}
function anchorFloating(el){const item=floatingItem(el);if(!item)return;const r=el.getBoundingClientRect(),host=nearestAnchor(r.top+Math.min(r.height/2,30));if(host===el.parentElement)return;const parent=host.getBoundingClientRect(),path=el.dataset.element;item.positionVersion=2;item.anchor=host.dataset.canvasAnchor||null;model.layout[layoutKey(path)]={...styleFor(path),x:(r.left-parent.left)/parent.width*100,y:(r.top-parent.top)/layoutScale(),w:r.width/parent.width*100};host.append(el);applyOne(el,path);}
function insertedTextHTML(page){return (model.textboxes||[]).map((item,i)=>item.page!==page?'':edit('textboxes.'+i+'.html','div','inserted-text')).join('');}
